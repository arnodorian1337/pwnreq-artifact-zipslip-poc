name: Wireit cache victim control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-victim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5
      - name: Install controlled dependencies
        working-directory: wireit-cache-poc
        run: npm ci
      - name: Restore or build the controlled Wireit output
        working-directory: wireit-cache-poc
        run: npm run build
      - name: Execute the normal cached output
        run: node wireit-cache-poc/dist/output.js
      - name: Future secret-bearing action
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.WIREIT_FUTURE_CANARY }}
          branch: controlled-wireit-cache-noop
          commit-message: controlled no-op
          title: controlled no-op
