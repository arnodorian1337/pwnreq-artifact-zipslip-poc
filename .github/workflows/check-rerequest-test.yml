name: Checks Rerequest Test

on:
  workflow_dispatch:

permissions:
  actions: read
  checks: write

jobs:
  rerequest:
    runs-on: ubuntu-latest
    steps:
      - name: Rerequest a completed GitHub Actions check run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response_code=$(curl -sS -o /tmp/rerequest-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/98220750007/rerequest")
          echo "REREQUEST_HTTP=$response_code"
          sed -n '1,20p' /tmp/rerequest-response.json
