name: MDX release metadata control

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compile-release-metadata:
    if: ${{ startsWith(github.head_ref, 'control/mdx-release-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install controlled MDX dependencies
        run: npm ci --prefix mdx-release-control
      - name: Compile release metadata as MDX
        run: node mdx-release-control/compile-event-body.mjs
