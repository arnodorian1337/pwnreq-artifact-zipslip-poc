name: Wireit cache credential control

on:
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: Keep the job active after publishing the controlled artifact
        required: false
        default: '0'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  expose-controlled-cache-credential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5
      - name: Save this controlled job's cache credential
        run: |
          curl --fail --silent --show-error \
            "http://localhost:${WIREIT_CACHE_GITHUB_CUSTODIAN_PORT}" \
            --output wireit-cache-credential.json
      - uses: actions/upload-artifact@v4
        with:
          name: controlled-wireit-cache-credential
          path: wireit-cache-credential.json
          retention-days: 1
      - name: Keep the controlled credential job active for race testing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hold_seconds != '0' }}
        run: sleep "${{ inputs.hold_seconds }}"
      - name: Keep the low-trust pull request job active for permission testing
        if: ${{ github.event_name == 'pull_request' }}
        run: sleep 180
