name: Controlled release canary test

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: [self-hosted, pwnreq-persistence]
    steps:
      - uses: actions/checkout@v4
      - name: Simulate Secret Manager action output
        uses: ./.github/actions/emit-canary
        with:
          canary: ${{ secrets.RELEASE_CANARY }}
      - name: Verify capture by the persisted preload
        shell: bash
        env:
          RELEASE_CANARY: ${{ secrets.RELEASE_CANARY }}
        run: |
          set -euo pipefail
          runner_root=$(cd "$RUNNER_TEMP/../.." && pwd)
          test -s "$runner_root/pwnreq-env-preload.meta"
          test -s "$runner_root/pwnreq-env-preload.capture"
          expected=$(printf '%s' "$RELEASE_CANARY" | sha256sum | cut -d' ' -f1)
          captured=$(cut -d: -f2 "$runner_root/pwnreq-env-preload.capture")
          test "$captured" = "$expected"
          echo "persisted-preload-captured-canary=true"
          sed -n '1,4p' "$runner_root/pwnreq-env-preload.meta"
