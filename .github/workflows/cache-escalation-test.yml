name: Cache and Checks Escalation Test

on:
  workflow_dispatch:

permissions:
  actions: read
  statuses: write
  checks: write

jobs:
  test-escalation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test cache and check capabilities from JS action
        uses: ./.github/actions/cache-test
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Show env for reference
        run: |
          echo "ACTIONS_CACHE_URL: ${ACTIONS_CACHE_URL:-NOT SET}"
          echo "ACTIONS_RUNTIME_URL: ${ACTIONS_RUNTIME_URL:-NOT SET}"
          echo "ACTIONS_RUNTIME_TOKEN length: ${#ACTIONS_RUNTIME_TOKEN}"
          env | grep -i ACTION | sort || true

      - name: Test Checks API rerequest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response_code=$(curl -sS -o /tmp/rerequest-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/98220750007/rerequest")
          echo "REREQUEST_HTTP=$response_code"
          sed -n '1,20p' /tmp/rerequest-response.json
