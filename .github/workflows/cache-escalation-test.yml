name: Cache and Checks Escalation Test

on:
  workflow_dispatch:

permissions:
  actions: read
  statuses: write
  checks: write

jobs:
  test-escalation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test cache and check capabilities from JS action
        uses: ./.github/actions/cache-test
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Show env for reference
        run: |
          echo "ACTIONS_CACHE_URL: ${ACTIONS_CACHE_URL:-NOT SET}"
          echo "ACTIONS_RUNTIME_URL: ${ACTIONS_RUNTIME_URL:-NOT SET}"
          echo "ACTIONS_RUNTIME_TOKEN length: ${#ACTIONS_RUNTIME_TOKEN}"
          env | grep -i ACTION | sort || true
